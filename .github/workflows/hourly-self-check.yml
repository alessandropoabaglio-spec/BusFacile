name: Controllo automatico Bus Facile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  check-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Controlla Maps
        run: |
          grep -q 'BUS_FACILE_MAPS_CLIENT_START' .github/workflows/build-apk.yml
          grep -q 'setPackage("com.google.android.apps.maps")' .github/workflows/build-apk.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          expected='function openGoogleMapsApp(webUrl){ if(window.FlashMyBusAndroid && typeof window.FlashMyBusAndroid.openGoogleMaps===\'function\'){ window.FlashMyBusAndroid.openGoogleMaps(webUrl); } else { window.location.href=webUrl; } }'
          if expected not in s:
              raise SystemExit('ERRORE: ponte nativo Google Maps assente o alterato; NON sovrascrivo index.html')
          print('OK: ponte nativo Google Maps preservato')
          PY

      - name: Commit correzioni
        run: |
          git config user.name 'Bus Facile AutoFix'
          git config user.email 'actions@github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'AutoFix Maps APK'; git push; fi

      - name: Avvia build APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main