name: Build Bus Facile APK
# build trigger fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'BusFacileAndroid-progetto-con-compilazione-GitHub.zip'
      - 'index.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara progetto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir android-project
          unzip -q BusFacileAndroid-progetto-con-compilazione-GitHub.zip -d android-project
          find android-project -type f | head -100
          test -n "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

      - name: Correggi geolocalizzazione WebView
        run: |
          MAIN="$(find "$GITHUB_WORKSPACE/android-project" -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN"
          echo "MainActivity: $MAIN"
          python3 - "$MAIN" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = "geolocationEnabled = true"
          new = "webView.settings.setGeolocationEnabled(true)"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Correzioni geolocation attese: 1, trovate: {count}")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -ni "setGeolocationEnabled" "$MAIN"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: BusFacile-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
