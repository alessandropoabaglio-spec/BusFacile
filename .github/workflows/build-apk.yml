name: Build Bus Facile APK
# build trigger fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'BusFacileAndroid-progetto-con-compilazione-GitHub.zip'
      - 'index.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara progetto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir android-project
          unzip -q BusFacileAndroid-progetto-con-compilazione-GitHub.zip -d android-project
          find android-project -type f | head -100
          test -n "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
      
      - name: Rinomina app Android in FlashMyBus
        run: |
          find "$GITHUB_WORKSPACE/android-project" -type f \( -name '*.xml' -o -name '*.kt' -o -name '*.kts' -o -name '*.gradle' \) -print0 | xargs -0 -r sed -i 's/Bus Facile/FlashMyBus/g; s/BUS FACILE/FLASHMYBUS/g'
          echo "Nome app Android aggiornato a FlashMyBus"
          grep -Rni "FlashMyBus" "$GITHUB_WORKSPACE/android-project" --include='*.xml' --include='*.kt' --include='*.kts' --include='*.gradle' | head -20

      - name: Sincronizza interfaccia web nell'APK
        run: |
          WEB_ASSET="$(find "$GITHUB_WORKSPACE/android-project" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$WEB_ASSET"
          cp "$GITHUB_WORKSPACE/index.html" "$WEB_ASSET"
          echo "Asset APK aggiornato: $WEB_ASSET"
          grep -q "FLASHMYBUS" "$WEB_ASSET"
          ! grep -qi "Orari STAV" "$WEB_ASSET"
          ! grep -qi "Sito Movibus" "$WEB_ASSET"
          grep -q 'window.FlashMyBusAndroid' "$WEB_ASSET"
          grep -q 'openGoogleMaps(webUrl)' "$WEB_ASSET"
          echo "OK: asset APK contiene il ponte nativo Google Maps"


      - name: Correggi geolocalizzazione WebView
        run: |
          MAIN="$(find "$GITHUB_WORKSPACE/android-project" -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN"
          echo "MainActivity: $MAIN"
          python3 - "$MAIN" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          replacements = [
              ("settings.geolocationEnabled = true", "webView.settings.setGeolocationEnabled(true)"),
              ("webView.settings.geolocationEnabled = true", "webView.settings.setGeolocationEnabled(true)"),
              ("geolocationEnabled = true", "webView.settings.setGeolocationEnabled(true)"),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  break
          if "setGeolocationEnabled(true)" not in s:
              raise SystemExit("Impossibile configurare la geolocalizzazione WebView")
          p.write_text(s)
          PY
          grep -ni "setGeolocationEnabled" "$MAIN"

          # FIX SCHERMATA NERA: rendering WebView stabile su dispositivi recenti.
          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          imp="import android.view.View"
          lines=s.splitlines()
          pkg=next(i for i,line in enumerate(lines) if line.startswith("package "))
          if imp not in s: lines.insert(pkg+1,imp)
          s="\n".join(lines)+("\n" if s.endswith("\n") else "")
          anchor="webView.settings.setGeolocationEnabled(true)"
          patch="""\n          // FLASHMYBUS_RENDER_FIX_START
          webView.settings.javaScriptEnabled = true
          webView.settings.domStorageEnabled = true
          webView.settings.allowFileAccess = true
          webView.settings.allowContentAccess = true
          webView.setLayerType(View.LAYER_TYPE_SOFTWARE, null)
          webView.setBackgroundColor(android.graphics.Color.rgb(8, 11, 18))
          // FLASHMYBUS_RENDER_FIX_END"""
          if "FLASHMYBUS_RENDER_FIX_START" not in s: s=s.replace(anchor,anchor+patch,1)
          p.write_text(s)
          PY
          grep -n "FLASHMYBUS_RENDER_FIX" "$MAIN"
          python3 - "$MAIN" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          imports = [
              "import android.content.Intent",
              "import android.net.Uri",
              "import android.webkit.WebResourceRequest",
              "import android.webkit.WebViewClient",
              "import android.webkit.WebView",
          ]
          lines = s.splitlines()
          missing = [imp for imp in imports if imp not in s]
          if missing:
              pkg = next(i for i, line in enumerate(lines) if line.startswith("package "))
              lines[pkg+1:pkg+1] = missing
              s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")

          # Elimina qualsiasi vecchio client Maps già presente e reinserisce sempre
          # la versione corrente, così ogni build parte da uno stato deterministico.
          s = re.sub(
              r'\n\s*// BUS_FACILE_MAPS_CLIENT_START.*?// BUS_FACILE_MAPS_CLIENT_END',
              '',
              s,
              flags=re.S
          )

          anchor = "webView.settings.setGeolocationEnabled(true)"
          if anchor not in s:
              raise SystemExit("Non trovo l'ancora WebView per il client Google Maps")

          block = '''\n          // BUS_FACILE_MAPS_CLIENT_START
          webView.webViewClient = object : WebViewClient() {
              override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest): Boolean {
                  return openBusFacileExternalUrl(request.url)
              }

              @Suppress("DEPRECATION")
              override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                  return if (url == null) false else openBusFacileExternalUrl(Uri.parse(url))
              }

              private fun openBusFacileExternalUrl(uri: Uri): Boolean {
                  if (uri.scheme == "flashmybusmaps") {
                      val target = uri.getQueryParameter("url")
                      if (target.isNullOrBlank()) return true
                      val mapsIntent = Intent(Intent.ACTION_VIEW, Uri.parse(target)).apply {
                          setPackage("com.google.android.apps.maps")
                      }
                      return try {
                          startActivity(mapsIntent)
                          true
                      } catch (_: Exception) {
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(target)))
                              true
                          } catch (_: Exception) {
                              true
                          }
                      }
                  }

                  val isGoogleMaps = uri.scheme == "https" &&
                      (uri.host == "www.google.com" || uri.host == "google.com") &&
                      (uri.path?.startsWith("/maps") == true)
                  if (!isGoogleMaps) return false

                  val intent = Intent(Intent.ACTION_VIEW, uri).apply {
                      setPackage("com.google.android.apps.maps")
                  }
                  return try {
                      startActivity(intent)
                      true
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, uri))
                          true
                      } catch (_: Exception) {
                          true
                      }
                  }
              }
          }
          // BUS_FACILE_MAPS_CLIENT_END'''
          s = s.replace(anchor, anchor + block, 1)
          p.write_text(s)
          PY
          grep -n "BUS_FACILE_MAPS_CLIENT" "$MAIN"

          # Ponte nativo diretto JavaScript -> Android -> Google Maps.
          # Non dipende da shouldOverrideUrlLoading, quindi evita ERR_UNKNOWN_URL_SCHEME.
          python3 - "$MAIN" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          imports = [
              "import android.webkit.JavascriptInterface",
              "import android.speech.tts.TextToSpeech",
              "import java.util.Locale",
          ]
          lines = s.splitlines()
          pkg = next(i for i, line in enumerate(lines) if line.startswith("package "))
          for imp in reversed(imports):
              if imp not in s:
                  lines.insert(pkg + 1, imp)
          s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")

          marker_start = "// FLASHMYBUS_NATIVE_MAPS_START"
          marker_end = "// FLASHMYBUS_NATIVE_MAPS_END"
          if marker_start in s and marker_end in s:
              import re
              s = re.sub(r'\n\s*// FLASHMYBUS_NATIVE_MAPS_START.*?// FLASHMYBUS_NATIVE_MAPS_END', '', s, flags=re.S)

          anchor = "webView.settings.setGeolocationEnabled(true)"
          if anchor not in s:
              raise SystemExit("Ancora WebView non trovata per il ponte Maps")

          block = r'''
          // FLASHMYBUS_NATIVE_MAPS_START
          webView.addJavascriptInterface(object {
              private var flashTts: TextToSpeech? = null
              private var flashTtsReady = false
              private var flashTtsPending: String? = null

              init {
                  flashTts = TextToSpeech(this@MainActivity) { result ->
                      runOnUiThread {
                          flashTtsReady = result == TextToSpeech.SUCCESS
                          if (flashTtsReady) {
                              flashTts?.language = Locale.ITALIAN
                              flashTts?.setSpeechRate(0.95f)
                              flashTtsPending?.let { pending ->
                                  flashTts?.speak(pending, TextToSpeech.QUEUE_FLUSH, null, "flashmybus")
                                  flashTtsPending = null
                              }
                          }
                      }
                  }
              }

              @JavascriptInterface
              fun speak(text: String) {
                  runOnUiThread {
                      if (text.isBlank()) return@runOnUiThread
                      if (!flashTtsReady) {
                          flashTtsPending = text
                          return@runOnUiThread
                      }
                      flashTts?.stop()
                      flashTts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "flashmybus")
                  }
              }

              @JavascriptInterface
              fun stopSpeech() {
                  runOnUiThread { flashTts?.stop() }
              }

              @JavascriptInterface
              fun ttsAvailable(): Boolean = flashTtsReady

              @JavascriptInterface
              fun openGoogleMaps(url: String) {
                  val target = Uri.parse(url)
                  val mapsIntent = Intent(Intent.ACTION_VIEW, target).apply {
                      setPackage("com.google.android.apps.maps")
                  }
                  runOnUiThread {
                      try {
                          startActivity(mapsIntent)
                      } catch (_: Exception) {
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, target))
                          } catch (_: Exception) {
                          }
                      }
                  }
              }
          }, "FlashMyBusAndroid")
          // FLASHMYBUS_NATIVE_MAPS_END
          '''

          s = s.replace(anchor, anchor + "\n" + block, 1)
          p.write_text(s)
          PY
          grep -n -E "FLASHMYBUS_NATIVE_MAPS|JavascriptInterface|addJavascriptInterface" "$MAIN"




      - name: Abilita notifiche Android native
        run: |
          MAIN="$(find "$GITHUB_WORKSPACE/android-project" -type f -name MainActivity.kt -print -quit)"
          MANIFEST="$(find "$GITHUB_WORKSPACE/android-project" -type f -name AndroidManifest.xml -path '*/src/main/*' -print -quit)"
          test -n "$MAIN"
          test -n "$MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          perm='    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              pos=s.find('<application')
              if pos < 0: raise SystemExit('AndroidManifest: application non trovato')
              s=s[:pos]+perm+'\n    '+s[pos:]
              p.write_text(s)
          PY
          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); s=p.read_text()
          if 'import android.webkit.JavascriptInterface' not in s:
              lines=s.splitlines()
              pkg=next(i for i,line in enumerate(lines) if line.startswith('package '))
              lines.insert(pkg+1,'import android.webkit.JavascriptInterface')
              s='\n'.join(lines)+('\n' if s.endswith('\n') else '')
          # Elimina i vecchi ponti Maps/notifiche e ne crea uno solo.
          s=re.sub(r'\n\s*// FLASHMYBUS_NATIVE_MAPS_START.*?// FLASHMYBUS_NATIVE_MAPS_END','',s,flags=re.S)
          s=re.sub(r'\n\s*// FLASHMYBUS_NATIVE_NOTIFICATIONS_START.*?// FLASHMYBUS_NATIVE_NOTIFICATIONS_END','',s,flags=re.S)
          s=re.sub(r'\n\s*// FLASHMYBUS_NATIVE_BRIDGE_START.*?// FLASHMYBUS_NATIVE_BRIDGE_END','',s,flags=re.S)
          s=re.sub(r'\n\s*// FLASHMYBUS_NATIVE_TTS_START.*?// FLASHMYBUS_NATIVE_TTS_END','',s,flags=re.S)
          anchor='webView.settings.setGeolocationEnabled(true)'
          if anchor not in s: raise SystemExit('Ancora WebView non trovata')
          block=r'''
          // FLASHMYBUS_NATIVE_BRIDGE_START
          fun ensureFlashMyBusNotificationChannel() {
              if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                  getSystemService(android.app.NotificationManager::class.java).createNotificationChannel(
                      android.app.NotificationChannel("flashmybus_alerts","Avvisi FlashMyBus",android.app.NotificationManager.IMPORTANCE_HIGH)
                  )
              }
          }
          webView.addJavascriptInterface(object {
              @JavascriptInterface
              fun openGoogleMaps(url: String) {
                  val target=Uri.parse(url)
                  val intent=Intent(Intent.ACTION_VIEW,target).apply { setPackage("com.google.android.apps.maps") }
                  runOnUiThread {
                      try { startActivity(intent) }
                      catch (_: Exception) { try { startActivity(Intent(Intent.ACTION_VIEW,target)) } catch (_: Exception) {} }
                  }
              }
              @JavascriptInterface
              fun notificationsAvailable(): Boolean {
                  return if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.N) {
                      getSystemService(android.app.NotificationManager::class.java).areNotificationsEnabled() &&
                      (android.os.Build.VERSION.SDK_INT < 33 || checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)==android.content.pm.PackageManager.PERMISSION_GRANTED)
                  } else true
              }
              @JavascriptInterface
              fun requestNotifications() {
                  ensureFlashMyBusNotificationChannel()
                  if (android.os.Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)!=android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS),9042)
                  }
              }
              @JavascriptInterface
              fun showNotification(title:String, body:String) {
                  runOnUiThread {
                      ensureFlashMyBusNotificationChannel()
                      if (android.os.Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)!=android.content.pm.PackageManager.PERMISSION_GRANTED) return@runOnUiThread
                      val builder=if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O)
                          android.app.Notification.Builder(this@MainActivity,"flashmybus_alerts")
                      else android.app.Notification.Builder(this@MainActivity)
                      getSystemService(android.app.NotificationManager::class.java).notify(
                          (System.currentTimeMillis()%100000).toInt(),
                          builder.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(body).setAutoCancel(true).build()
                      )
                  }
              }
          },"FlashMyBusAndroid")
          // FLASHMYBUS_NATIVE_BRIDGE_END
          '''
          s=s.replace(anchor,anchor+'\n'+block,1)
          p.write_text(s)
          PY
          grep -n -E "FLASHMYBUS_NATIVE_BRIDGE|openGoogleMaps|requestNotifications|showNotification|POST_NOTIFICATIONS" "$MAIN" "$MANIFEST"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: BusFacile-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
