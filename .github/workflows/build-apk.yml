name: Build Bus Facile APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'BusFacileAndroid-progetto-con-compilazione-GitHub.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara progetto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir android-project
          unzip -q BusFacileAndroid-progetto-con-compilazione-GitHub.zip -d android-project
          find android-project -type f | head -100
          test -n "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

      - name: Correggi geolocalizzazione WebView
        run: |
          MAIN="$(find "$GITHUB_WORKSPACE/android-project" -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN"
          echo "MainActivity: $MAIN"
          grep -n "geolocationEnabled" "$MAIN" || true
          python3 - "$MAIN" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s2, n = re.subn(r'^([ \t]*)geolocationEnabled\s*=\s*true\s*$', r'\1settings.setGeolocationEnabled(true)', s, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit(f"Attesa 1 riga geolocationEnabled, trovate {n}")
          p.write_text(s2)
          PY
          grep -n "geolocation" "$MAIN"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: BusFacile-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
