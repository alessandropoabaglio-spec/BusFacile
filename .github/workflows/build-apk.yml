name: Build Bus Facile APK
# build trigger fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'BusFacileAndroid-progetto-con-compilazione-GitHub.zip'
      - 'index.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara progetto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir android-project
          unzip -q BusFacileAndroid-progetto-con-compilazione-GitHub.zip -d android-project
          find android-project -type f | head -100
          test -n "$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
      
      - name: Rinomina app Android in FlashMyBus
        run: |
          find "$GITHUB_WORKSPACE/android-project" -type f \( -name '*.xml' -o -name '*.kt' -o -name '*.kts' -o -name '*.gradle' \) -print0 | xargs -0 -r sed -i 's/Bus Facile/FlashMyBus/g; s/BUS FACILE/FLASHMYBUS/g'
          echo "Nome app Android aggiornato a FlashMyBus"
          grep -Rni "FlashMyBus" "$GITHUB_WORKSPACE/android-project" --include='*.xml' --include='*.kt' --include='*.kts' --include='*.gradle' | head -20

      - name: Sincronizza interfaccia web nell'APK
        run: |
          WEB_ASSET="$(find "$GITHUB_WORKSPACE/android-project" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$WEB_ASSET"
          cp "$GITHUB_WORKSPACE/index.html" "$WEB_ASSET"
          echo "Asset APK aggiornato: $WEB_ASSET"
          grep -q "FLASHMYBUS" "$WEB_ASSET"
          ! grep -qi "Orari STAV" "$WEB_ASSET"
          ! grep -qi "Sito Movibus" "$WEB_ASSET"


      - name: Correggi geolocalizzazione WebView
        run: |
          MAIN="$(find "$GITHUB_WORKSPACE/android-project" -type f -name MainActivity.kt -print -quit)"
          test -n "$MAIN"
          echo "MainActivity: $MAIN"
          python3 - "$MAIN" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          replacements = [
              ("settings.geolocationEnabled = true", "webView.settings.setGeolocationEnabled(true)"),
              ("webView.settings.geolocationEnabled = true", "webView.settings.setGeolocationEnabled(true)"),
              ("geolocationEnabled = true", "webView.settings.setGeolocationEnabled(true)"),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  break
          if "setGeolocationEnabled(true)" not in s:
              raise SystemExit("Impossibile configurare la geolocalizzazione WebView")
          p.write_text(s)
          PY
          grep -ni "setGeolocationEnabled" "$MAIN"
          python3 - "$MAIN" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()

          imports = [
              "import android.content.Intent",
              "import android.net.Uri",
              "import android.webkit.WebResourceRequest",
              "import android.webkit.WebViewClient",
              "import android.webkit.WebView",
          ]
          lines = s.splitlines()
          missing = [imp for imp in imports if imp not in s]
          if missing:
              pkg = next(i for i, line in enumerate(lines) if line.startswith("package "))
              lines[pkg+1:pkg+1] = missing
              s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")

          # Elimina qualsiasi vecchio client Maps già presente e reinserisce sempre
          # la versione corrente, così ogni build parte da uno stato deterministico.
          s = re.sub(
              r'\n\s*// BUS_FACILE_MAPS_CLIENT_START.*?// BUS_FACILE_MAPS_CLIENT_END',
              '',
              s,
              flags=re.S
          )

          anchor = "webView.settings.setGeolocationEnabled(true)"
          if anchor not in s:
              raise SystemExit("Non trovo l'ancora WebView per il client Google Maps")

          block = '''\n          // BUS_FACILE_MAPS_CLIENT_START
          webView.webViewClient = object : WebViewClient() {
              override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest): Boolean {
                  return openBusFacileExternalUrl(request.url)
              }

              @Suppress("DEPRECATION")
              override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                  return if (url == null) false else openBusFacileExternalUrl(Uri.parse(url))
              }

              private fun openBusFacileExternalUrl(uri: Uri): Boolean {
                  if (uri.scheme == "flashmybusmaps") {
                      val target = uri.getQueryParameter("url")
                      if (target.isNullOrBlank()) return true
                      val mapsIntent = Intent(Intent.ACTION_VIEW, Uri.parse(target)).apply {
                          setPackage("com.google.android.apps.maps")
                      }
                      return try {
                          startActivity(mapsIntent)
                          true
                      } catch (_: Exception) {
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(target)))
                              true
                          } catch (_: Exception) {
                              true
                          }
                      }
                  }

                  val isGoogleMaps = uri.scheme == "https" &&
                      (uri.host == "www.google.com" || uri.host == "google.com") &&
                      (uri.path?.startsWith("/maps") == true)
                  if (!isGoogleMaps) return false

                  val intent = Intent(Intent.ACTION_VIEW, uri).apply {
                      setPackage("com.google.android.apps.maps")
                  }
                  return try {
                      startActivity(intent)
                      true
                  } catch (_: Exception) {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, uri))
                          true
                      } catch (_: Exception) {
                          true
                      }
                  }
              }
          }
          // BUS_FACILE_MAPS_CLIENT_END'''
          s = s.replace(anchor, anchor + block, 1)
          p.write_text(s)
          PY
          grep -n "BUS_FACILE_MAPS_CLIENT" "$MAIN"


      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: BusFacile-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
