<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf6ff">
<title>FlashMyBus</title>
<style>
:root{color-scheme:light;--bg:#eef8ff;--panel:#ffffff;--panel2:#f5fbff;--text:#123047;--muted:#60798c;--blue:#168bd0;--blue2:#36b7f2;--green:#20a86b;--line:#cfe4f2;--shadow:0 14px 34px rgba(35,105,145,.13)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 100% 0%,#d9f2ff 0,transparent 32%),linear-gradient(180deg,#f4fbff 0%,#e8f5fc 52%,#f7fcff 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);min-height:100vh}
main{max-width:680px;margin:auto;padding:18px 15px 38px}
.brand{display:flex;align-items:center;gap:12px;margin:7px 0 21px}
.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#75d8ff,#168bd0);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px #2386c944}
.brand h1{font-size:26px;letter-spacing:-.7px;line-height:1.05;margin:0;font-weight:850}
.brand p{margin:5px 0 0;color:#648196;font-size:13px}
.top-tag{margin-left:auto;font-size:11px;color:#08784d;border:1px solid #9cdbc1;background:#e8f8f0;border-radius:999px;padding:6px 9px;white-space:nowrap}
.hero{background:linear-gradient(140deg,#dff4ff,#ccecff 65%,#eaf8ff);border:1px solid #b9dff2;border-radius:24px;padding:19px 17px;margin:0 0 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-80px;top:-80px;background:#61c7ff12;border:1px solid #7dd8ff12;pointer-events:none}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:var(--blue);margin-bottom:8px}
.hero h2{font-size:23px;line-height:1.2;letter-spacing:-.5px;margin:0 0 7px;max-width:350px}
.hero p{color:#557286;font-size:14px;line-height:1.5;margin:0;max-width:440px}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:21px;padding:17px;margin:13px 0;box-shadow:0 10px 30px #0002}
.section-head{display:flex;align-items:center;gap:10px;margin:0 0 13px}
.section-icon{width:36px;height:36px;border-radius:12px;background:#e3f4fd;border:1px solid #b9dfef;display:grid;place-items:center;font-size:18px;flex:none}
.section-head h2{font-size:17px;letter-spacing:-.2px;margin:0}
.label{display:block;font-size:13px;font-weight:700;color:#36566b;margin-bottom:8px}
input,select{width:100%;padding:15px 14px;border-radius:14px;border:1px solid #bdd7e7;background:#f8fcff;color:var(--text);font-size:16px;outline:none;transition:border .15s,box-shadow .15s}
input::placeholder{color:#91a7b6}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #75d4ff20}
.field{margin:15px 0}
.btn{display:flex;justify-content:center;align-items:center;gap:9px;width:100%;border:0;border-radius:14px;padding:15px 13px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.985)}
.primary{background:linear-gradient(100deg,#8ce2ff,#58bafa);color:#062034;box-shadow:0 8px 22px #38a8ed26}
.secondary{background:#f0f8fd;color:#18506f;border:1px solid #b9d7e7}
.btn:disabled{opacity:.55}
.status{color:var(--muted);font-size:13px;line-height:1.5;margin-top:11px;display:flex;gap:8px;align-items:flex-start}
.status:before{content:"ⓘ";color:var(--blue);font-weight:800}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid #c7dce9;background:#f7fcff;border-radius:17px;padding:15px 12px;text-align:left;color:var(--text);cursor:pointer;transition:.15s;min-height:118px}\n.mode span{display:block;font-size:22px;margin-bottom:8px}.mode strong{display:block;font-size:14px;margin-bottom:5px}.mode small{display:block;color:var(--muted);font-size:11px;line-height:1.4}.mode.active{border-color:#58bafa;background:linear-gradient(145deg,#e8f8ff,#d7f1ff);box-shadow:0 7px 20px #38a8ed1c}
.plan-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid #c7dce9;border-radius:13px;background:#f8fcff;font-size:13px;font-weight:700;cursor:pointer}.choice input{width:auto;padding:0;box-shadow:none}\n@media(max-width:400px){main{padding:14px 12px 30px}.brand h1{font-size:23px}.top-tag{font-size:10px;padding:5px 7px}.hero{padding:17px 15px}.hero h2{font-size:21px}.stop-actions{grid-template-columns:1fr}.mode-grid,.plan-fields,.choice-row{grid-template-columns:1fr}}
.position{display:flex;gap:11px;align-items:center;background:#f7fcff;border:1px solid #c9dfeb;padding:13px;border-radius:15px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #83e4b61a;flex:none}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.stop{border-top:1px solid #d9e8f0;padding:14px 0}
.stop:first-child{border-top:0}
.stop strong{font-size:15px;color:#173e55;display:block;margin-bottom:5px}
.stop .small{display:flex;align-items:center;gap:5px}
.stop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.stop-actions .btn{font-size:12px;padding:12px 8px}
.hidden{display:none!important}
.notice{border-left:3px solid #e9b84d;padding:11px 12px;background:#fff8e7;color:#75530e;border-radius:8px;font-size:13px;line-height:1.5}
.muted{color:var(--muted)}
.divider{height:1px;background:var(--line);margin:15px 0}
footer{text-align:center;color:#7f98ab;font-size:11px;margin-top:22px;line-height:1.6}
a:not(.btn){color:var(--blue)}
@media(max-width:400px){main{padding:14px 12px 30px}.brand h1{font-size:23px}.top-tag{font-size:10px;padding:5px 7px}.hero{padding:17px 15px}.hero h2{font-size:21px}.stop-actions{grid-template-columns:1fr}}
<style>
.route-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.route-card{border:1px solid #c7dce9;border-radius:16px;background:#f8fcff;padding:14px}
.route-card strong{display:block;font-size:15px;color:#173e55;margin-bottom:6px}
.route-card .route-meta{font-size:12px;color:#60798c;line-height:1.5}
.google-btn{background:linear-gradient(100deg,#fff,#f1f7fb);border:1px solid #b9d7e7;color:#18506f}

.map-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px;color:#60798c}
.route-placeholder{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 12px;border:1px dashed #b9d7e7;border-radius:16px;background:#f8fcff;color:#60798c}
.route-placeholder strong{color:#173e55;font-size:15px}.route-spinner{font-size:26px}.notify-toggle{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #c7dce9;border-radius:14px;background:#f8fcff;cursor:pointer}.notify-toggle input{width:auto}.notify-toggle b{font-size:13px}
.choice-row{display:grid;grid-template-columns:1fr;gap:8px}.choice{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid #c7dce9;border-radius:13px;background:#f8fcff;font-size:13px;font-weight:700;cursor:pointer}.choice input{width:auto;padding:0;box-shadow:none}
@media(min-width:500px){.choice-row{grid-template-columns:1fr 1fr 1fr}}
</style></style>
<style>
.interest-card{background:linear-gradient(145deg,#f4fbff,#e9f8ff);border-color:#a9d8ee}
.interest-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#08784d;background:#e8f8f0;border:1px solid #9cdbc1;border-radius:999px;padding:5px 8px;margin-top:4px}
.interest-grid{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.interest-grid .btn{width:auto;min-width:110px}
.interest-status{margin-top:10px;padding:11px 12px;border-radius:12px;background:#f7fcff;border:1px solid #c7dce9;font-size:12px;line-height:1.5;color:#557286}
.interest-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:400px){.interest-grid{grid-template-columns:1fr}.interest-grid .btn{width:100%}}

.mural-visual{margin:0 0 14px;border-radius:24px;overflow:hidden;border:1px solid #b9dff2;box-shadow:var(--shadow);background:#dff4ff}.mural-visual svg{display:block;width:100%;height:auto}.mural-visual text{letter-spacing:.4px}
</style>

<!-- FlashMyBus redesigned trip planner: Bus predefinito -->
<body>
<main>
<header class="brand"><div class="logo">🚌</div><div><h1>FLASHMYBUS</h1><p>Il modo più semplice per arrivare dove vuoi.</p></div><div class="top-tag">● GPS</div></header>
<section class="mural-visual mural-reference" aria-label="FlashMyBus graffiti"><img src="assets/fmb-graffiti-x1.b64" alt="FlashMyBus graffiti" id="graffitiArtwork"></section><section class="hero"><div class="eyebrow">Trasporto pubblico intelligente</div><h2>Dimmi dove vuoi andare. Al resto pensiamo noi.</h2><p>Bus selezionato automaticamente. Puoi cambiare modalità di trasporto in qualsiasi momento.</p></section>
<section class="card"><div class="section-head"><div class="section-icon">🧭</div><div><h2>Come vuoi viaggiare?</h2><div class="small">Puoi partire subito oppure programmare il viaggio.</div></div></div>
<div class="mode-grid"><button class="mode active" id="nowMode"><span>⚡</span><strong>Viaggio adesso</strong><small>Trova la soluzione migliore in partenza ora</small></button><button class="mode" id="planMode"><span>📅</span><strong>Programma viaggio</strong><small>Scegli giorno e ora per domani o un'altra data</small></button></div></section>
<section class="card"><div class="section-head"><div class="section-icon">📍</div><h2>Il tuo viaggio</h2></div>
<div class="field"><label class="label">Partenza</label><div class="position"><span class="dot"></span><div style="flex:1"><strong id="originText">Usa la mia posizione</strong><div class="small" id="coordText">Il GPS individuerà automaticamente il punto di partenza.</div></div></div><button class="btn secondary" id="gpsBtn" style="margin-top:9px">📍 Usa posizione GPS</button></div>
<div class="field"><label class="label" for="destination">🎯 Destinazione</label><input id="destination" autocomplete="off" placeholder="Es. Stazione di Magenta, Milano, via Roma..."></div>
<div id="planFields" class="hidden">
<div class="field"><label class="label">🚏 Da dove vuoi partire?</label>
<div class="choice-row" id="originChoices">
<label class="choice"><input type="radio" name="originMode" value="gps"> 📍 Usa posizione attuale (GPS)</label>
<label class="choice"><input type="radio" name="originMode" value="address"> ✏️ Inserisci un indirizzo</label>
<label class="choice"><input type="radio" name="originMode" value="map"> 🗺️ Scegli dalla mappa</label>
</div>
<div id="originAddressField" class="field hidden"><input id="plannedOrigin" autocomplete="off" placeholder="Es. Marcallo, via Alessandro Volta..."></div>
<div id="originMapField" class="field hidden"><button class="btn secondary" id="mapOriginBtn" type="button">🗺️ Apri Google Maps per scegliere la partenza</button><div class="small" style="margin-top:7px">Dopo aver scelto il punto in Google Maps, puoi usare l'indirizzo del punto selezionato come partenza.</div></div>
<div id="originGpsField" class="field hidden"><div class="position"><span class="dot"></span><div style="flex:1"><strong id="plannedGpsText">Posizione attuale</strong><div class="small" id="plannedGpsCoords">Premi il pulsante per rilevare la posizione.</div></div></div><button class="btn secondary" id="plannedGpsBtn" type="button" style="margin-top:9px">📍 Rileva posizione GPS</button></div>
</div>
<div class="field"><label class="label">Quando?</label><div class="plan-fields"><input id="travelDate" type="date" aria-label="Data del viaggio"><input id="travelTime" type="time" aria-label="Ora del viaggio"></div></div><div class="choice-row"><label class="choice"><input type="radio" name="when" value="depart" checked> Partire alle</label><label class="choice"><input type="radio" name="when" value="arrive"> Arrivare entro</label></div></div>
<button class="btn primary" id="searchBtn">🔎 Trova il percorso migliore</button><div class="status" id="status">Per un viaggio immediato usiamo il GPS. Per un viaggio programmato puoi indicare una partenza diversa.</div></section>
<section class="card hidden" id="resultsCard"><div class="section-head"><div class="section-icon">⭐</div><div><h2>Soluzione migliore</h2><div class="small" id="resultSummary"></div></div></div><div id="resultList"></div><div class="notice">Per i viaggi programmati la partenza viene usata come punto scelto da te, non come posizione GPS. Il vincolo “Arrivare entro” viene mantenuto nella richiesta del viaggio; il collegamento Google Maps viene usato come fallback.</div></section>
<section class="card hidden" id="arrivalCard"><div class="section-head"><div class="section-icon">🔔</div><div><h2>Avviso di arrivo</h2><div class="small">Ti avvisiamo prima dell'ultima fermata.</div></div></div><label class="notify-toggle"><input type="checkbox" id="arrivalNotify"><span></span><b>Avvisami quando sto per arrivare</b></label><div class="small" id="arrivalStatus">L'avviso si attiverà quando il percorso avrà identificato la fermata finale.</div><button class="btn secondary" id="voiceTest" style="margin-top:10px">🔊 Prova voce</button></section>
<section class="card interest-card" id="interestCard">
<div class="section-head"><div class="section-icon">⭐</div><div><h2>La mia linea di interesse</h2><div class="small">Segui la linea che usi più spesso e ricevi solo gli avvisi che ti riguardano.</div><div class="interest-badge" id="anonymousBadge">👤 Utente anonimo</div></div></div>
<div class="field"><label class="label" for="interestLine">Linea abituale</label><div class="interest-grid"><input id="interestLine" autocomplete="off" placeholder="Es. Z646"><button class="btn primary" id="saveInterestBtn" type="button">⭐ Segui linea</button></div></div>
<label class="notify-toggle"><input type="checkbox" id="interestNotify"><span></span><b>Avvisami dei ritardi della mia linea</b></label>
<div class="interest-status" id="interestStatus">Nessuna linea seguita. Quando una corsa verrà identificata automaticamente, potremo proporre di seguirla con un solo tocco.</div>
<div class="interest-actions"><button class="btn secondary" id="clearInterestBtn" type="button">Rimuovi linea</button><button class="btn secondary" id="requestNotifyBtn" type="button">🔔 Attiva notifiche</button></div>
</section><section class="card"><div class="section-head"><div class="section-icon">🛡️</div><div><h2>Come funziona</h2></div></div><p class="small" style="margin:0">FlashMyBus non usa il tuo abbonamento come filtro del percorso. L'obiettivo è confrontare il trasporto pubblico disponibile nella zona e proporti la soluzione più rapida, con meno cambi o con meno attesa.</p></section>
<footer>FLASHMYBUS • Strumento indipendente, non ufficiale</footer>
</main>
<script>
fetch('assets/fmb-graffiti-x1.b64').then(r=>r.text()).then(b=>{const i=document.getElementById('graffitiArtwork'); if(i)i.src='data:image/jpeg;base64,'+b.trim()}).catch(()=>{});
let pos=null,originPoint=null,destinationPoint=null,finalStop=null,watchId=null,alertDone=false;
const $=id=>document.getElementById(id); function status(s){$('status').textContent=s}
function initDate(){const d=new Date();d.setMinutes(d.getMinutes()+5);$('travelDate').value=d.toISOString().slice(0,10);$('travelTime').value=d.toTimeString().slice(0,5)} initDate();
$('nowMode').onclick=()=>{$('nowMode').classList.add('active');$('planMode').classList.remove('active');$('planFields').classList.add('hidden');$('originText').textContent=pos?'Posizione GPS rilevata':'Usa la mia posizione';$('coordText').textContent=pos?pos.lat.toFixed(5)+', '+pos.lon.toFixed(5):'Il GPS individuerà automaticamente il punto di partenza.';status('Viaggio adesso: useremo la tua posizione GPS.')};
$('planMode').onclick=()=>{$('planMode').classList.add('active');$('nowMode').classList.remove('active');$('planFields').classList.remove('hidden');status('Viaggio programmato: scegli una sola modalità di partenza, poi giorno e ora.');};
$('gpsBtn').onclick=()=>{if(!navigator.geolocation){status('Questo dispositivo non supporta il GPS.');return}status('Rilevo la posizione…');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};$('originText').textContent='Posizione GPS rilevata';$('coordText').textContent=pos.lat.toFixed(5)+', '+pos.lon.toFixed(5);$('gpsBtn').textContent='✓ Posizione acquisita';status('Posizione acquisita. Ora inserisci la destinazione.')},e=>status(e.code===1?'Permesso GPS negato. Abilita la posizione nel browser.':'Non riesco a rilevare la posizione. Riprova.'),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})};
function setOriginMode(mode){
  document.querySelectorAll('input[name="originMode"]').forEach(r=>r.checked=r.value===mode);
  $('originAddressField').classList.toggle('hidden',mode!=='address');
  $('originMapField').classList.toggle('hidden',mode!=='map');
  $('originGpsField').classList.toggle('hidden',mode!=='gps');
  if(mode==='address'){$('plannedOrigin').focus();status('Inserisci l’indirizzo di partenza.')}
  if(mode==='map')status('Apri Google Maps e scegli il punto di partenza. Puoi poi usare l’indirizzo del punto selezionato.')
  if(mode==='gps')status('Usa la posizione attuale del GPS come punto di partenza.')
}
document.querySelectorAll('input[name="originMode"]').forEach(r=>r.onchange=()=>setOriginMode(r.value));
$('plannedGpsBtn').onclick=()=>{if(!navigator.geolocation){status('Questo dispositivo non supporta il GPS.');return}status('Rilevo la posizione attuale…');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};originPoint={...pos,name:'Posizione GPS'};$('plannedGpsText').textContent='Posizione GPS rilevata';$('plannedGpsCoords').textContent=pos.lat.toFixed(5)+', '+pos.lon.toFixed(5);status('Posizione GPS acquisita come partenza programmata.')},e=>status(e.code===1?'Permesso GPS negato. Abilita la posizione nel browser.':'Non riesco a rilevare la posizione. Riprova.'),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})};
function openGoogleMapsApp(webUrl){ if(window.FlashMyBusAndroid && typeof window.FlashMyBusAndroid.openGoogleMaps==='function'){ window.FlashMyBusAndroid.openGoogleMaps(webUrl); } else { window.location.href=webUrl; } }
$('mapOriginBtn').onclick=()=>{const q=$('destination').value.trim()||'Italia';const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);openGoogleMapsApp(url);status('Apro l’app Google Maps per scegliere la partenza.')};
async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=it&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('geocoding');const a=await r.json();if(!a.length)throw new Error('destinazione');return{lat:Number(a[0].lat),lon:Number(a[0].lon),name:a[0].display_name}}
$('searchBtn').onclick=async()=>{
 const planned=$('planMode').classList.contains('active');
 const destination=$('destination').value.trim();
 if(!destination){status('Inserisci una destinazione.');$('destination').focus();return}
 if(planned){
   const originMode=document.querySelector('input[name="originMode"]:checked')?.value;
   if(!originMode){status('Scegli come impostare la partenza: GPS, indirizzo oppure mappa.');return}
   if(originMode==='address'&&!$('plannedOrigin').value.trim()){status('Inserisci l’indirizzo di partenza.');$('plannedOrigin').focus();return}
   if(originMode==='gps'&&!originPoint){status('Premi “Rileva posizione GPS” per impostare la partenza.');return}
 }else if(!pos){status('Prima premi “Usa posizione GPS”.');return}
 status(planned?'Cerco partenza, destinazione e preparo il viaggio programmato…':'Cerco destinazione e preparo la ricerca del trasporto pubblico…');
 $('searchBtn').disabled=true;
 try{
   const plannedOrigin=$('plannedOrigin').value.trim();
   const originMode=document.querySelector('input[name="originMode"]:checked')?.value;
   let originError=false,destinationError=false;
   if(planned){
     if(originMode==='address'){
       try{originPoint=await geocode(plannedOrigin)}catch(e){originError=true;originPoint={name:plannedOrigin}}
     }else if(originMode==='gps'){
       originPoint={...originPoint,name:'Posizione GPS'};
     }else if(originMode==='map'){
       if(!originPoint) originPoint={name:plannedOrigin||'Punto scelto su Google Maps'};
     }
   }else{
     originPoint={...pos,name:'Posizione GPS'};
   }
   try{destinationPoint=await geocode(destination)}catch(e){destinationError=true;destinationPoint={name:destination}}
   const when=document.querySelector('input[name="when"]:checked')?.value||'depart';
   const date=$('travelDate').value, time=$('travelTime').value;
   $('resultsCard').classList.remove('hidden');$('arrivalCard').classList.remove('hidden');
   const originLabel=(originPoint.name||plannedOrigin).split(',').slice(0,2).join(',');
   const destinationLabel=(destinationPoint.name||destination).split(',').slice(0,2).join(',');
   $('resultSummary').textContent=originLabel+' → '+destinationLabel;
   const constraint=planned?(when==='arrive'?'Arrivare entro '+time:'Partire alle '+time):'Partire adesso';
   $('resultList').innerHTML='<div class="route-placeholder"><div class="route-spinner">🚌</div><strong>'+constraint+'</strong><span>Partenza: '+originLabel+'<br>Destinazione: '+destinationLabel+'</span><div class="route-actions"><button class="btn primary" id="googleRouteBtn">🗺️ Apri percorso in Google Maps</button></div></div>';
   $('googleRouteBtn').onclick=()=>openGoogleTransit();
   if(originError||destinationError){
     status('Non riesco a geocodificare con precisione il punto, ma puoi comunque aprire il percorso in Google Maps.');
   }else{
     status(planned?(when==='arrive'?'Vincolo “Arrivare entro” impostato alle '+time+'.':'Vincolo “Partire alle” impostato alle '+time+'.'):'Destinazione trovata. Percorso dalla posizione GPS.');
   }
 }catch(e){status('Errore durante la ricerca. Riprova.')}finally{$('searchBtn').disabled=false}
};
function openGoogleTransit(){
 const origin=originPoint?.lat!=null&&originPoint?.lon!=null
   ?originPoint.lat+','+originPoint.lon
   :$('plannedOrigin').value.trim();
 const destination=destinationPoint?.lat!=null&&destinationPoint?.lon!=null
   ?destinationPoint.lat+','+destinationPoint.lon
   :$('destination').value.trim();
 if(!origin||!destination)return;
 const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode=transit&transit_mode=bus';
 openGoogleMapsApp(url);
}
$('arrivalNotify').onchange=()=>{if($('arrivalNotify').checked){if(!finalStop){$('arrivalStatus').textContent='Attivata: appena il percorso fornirà la fermata finale, FlashMyBus inizierà a controllare la posizione.';return}startArrivalWatch()}else{stopArrivalWatch();$('arrivalStatus').textContent='Avviso disattivato.'}};
$('voiceTest').onclick=()=>{const text='Attenzione. Stai arrivando alla tua fermata.';if(window.FlashMyBusAndroid&&typeof window.FlashMyBusAndroid.speak==='function'){window.FlashMyBusAndroid.speak(text);return}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.95;speechSynthesis.speak(u)}else alert('La sintesi vocale non è disponibile su questo dispositivo.')};
function startArrivalWatch(){if(!navigator.geolocation||!finalStop)return;if(watchId)return;alertDone=false;watchId=navigator.geolocation.watchPosition(p=>{const d=distance(p.coords.latitude,p.coords.longitude,finalStop.lat,finalStop.lon);$('arrivalStatus').textContent='Distanza dalla fermata finale: '+Math.round(d)+' m';if(d<=300&&!alertDone){alertDone=true;if('vibrate'in navigator)navigator.vibrate([300,150,300]);if(window.FlashMyBusAndroid&&typeof window.FlashMyBusAndroid.showNotification==='function'){window.FlashMyBusAndroid.showNotification('FlashMyBus','Tra poco arriva la tua fermata.')}else if('Notification'in window&&Notification.permission==='granted')new Notification('FlashMyBus',{body:'Tra poco arriva la tua fermata.'});if(window.FlashMyBusAndroid&&typeof window.FlashMyBusAndroid.speak==='function'){window.FlashMyBusAndroid.speak('Attenzione. Tra poco arriva la tua fermata.')}else if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance('Attenzione. Tra poco arriva la tua fermata.');u.lang='it-IT';u.rate=.95;speechSynthesis.speak(u)}}},()=>{},{enableHighAccuracy:true,maximumAge:10000,timeout:10000});if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}
function stopArrivalWatch(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null}
function distance(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
// --- LINEA DI INTERESSE / COMMUNITY (fase 1) ---
function getAnonymousUserId(){const key='flashmybus_anonymous_user_id';let id=localStorage.getItem(key);if(!id){const n=(crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*1e9);id='Utente '+String(n).slice(-3).padStart(3,'0');localStorage.setItem(key,id)}return id}
function loadInterest(){const line=localStorage.getItem('flashmybus_interest_line')||'';const notify=localStorage.getItem('flashmybus_interest_notify')==='1';$('anonymousBadge').textContent='👤 '+getAnonymousUserId();$('interestLine').value=line;$('interestNotify').checked=notify;if(line)$('interestStatus').textContent='Stai seguendo la linea '+line+'. '+(notify?'Riceverai gli avvisi disponibili per questa linea.':'Gli avvisi sono disattivati.')}
function saveInterest(){const line=$('interestLine').value.trim().toUpperCase();if(!line){$('interestStatus').textContent='Inserisci il numero della linea per seguirla.';return}localStorage.setItem('flashmybus_interest_line',line);localStorage.setItem('flashmybus_interest_notify',$('interestNotify').checked?'1':'0');$('interestStatus').textContent='Linea '+line+' seguita. Le segnalazioni future potranno essere filtrate su questa linea.'}
$('saveInterestBtn').onclick=saveInterest;
$('interestNotify').onchange=()=>{const line=localStorage.getItem('flashmybus_interest_line');if(!line&&$('interestNotify').checked){$('interestNotify').checked=false;$('interestStatus').textContent='Prima scegli la tua linea di interesse.';return}localStorage.setItem('flashmybus_interest_notify',$('interestNotify').checked?'1':'0');if(line)$('interestStatus').textContent='Linea '+line+' seguita. '+($('interestNotify').checked?'Avvisi ritardi attivati.':'Avvisi ritardi disattivati.')};
$('clearInterestBtn').onclick=()=>{localStorage.removeItem('flashmybus_interest_line');localStorage.removeItem('flashmybus_interest_notify');$('interestLine').value='';$('interestNotify').checked=false;$('interestStatus').textContent='Nessuna linea seguita. Quando una corsa verrà identificata automaticamente, potremo proporre di seguirla con un solo tocco.'};
$('requestNotifyBtn').onclick=async()=>{if(window.FlashMyBusAndroid&&typeof window.FlashMyBusAndroid.requestNotifications==='function'){window.FlashMyBusAndroid.requestNotifications();$('interestStatus').textContent='Richiesta di autorizzazione alle notifiche inviata ad Android. Scegli “Consenti” nella finestra di sistema.';setTimeout(()=>{const ok=typeof window.FlashMyBusAndroid.notificationsAvailable==='function'&&window.FlashMyBusAndroid.notificationsAvailable();$('interestStatus').textContent=ok?'Notifiche di sistema abilitate.':'Notifiche non ancora abilitate. Premi di nuovo “Attiva notifiche” se necessario.'},1800);return}if(!('Notification'in window)){$('interestStatus').textContent='Le notifiche di sistema non sono disponibili su questo dispositivo.';return}const p=await Notification.requestPermission();$('interestStatus').textContent=p==='granted'?'Notifiche di sistema abilitate.':'Notifiche non abilitate.'};
loadInterest();
</script></body>
