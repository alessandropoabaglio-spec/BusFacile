<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="1800" height="2200">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087fca"/><stop offset=".5" stop-color="#20aee5"/><stop offset="1" stop-color="#07558c"/></linearGradient>
